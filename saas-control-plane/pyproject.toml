[tool.poetry]
name = "litellm-saas-control-plane"
version = "0.1.0"
description = "SaaS control plane for multi-tenant LiteLLM instance management"
authors = ["newcreator-org"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.0"
pytest = "^8.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
