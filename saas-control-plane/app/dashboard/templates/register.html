{% extends "base.html" %}
{% block title %}Register — Connect LM SaaS{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white shadow rounded-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>

        {% if error %}
        <div class="mb-4 p-3 rounded-md bg-red-50 text-red-700 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/dashboard/register">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1" for="display_name">Name</label>
                <input type="text" id="display_name" name="display_name" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <p class="text-xs text-gray-400 mt-1">Minimum 8 characters</p>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                Register
            </button>
        </form>

        <p class="text-xs text-gray-400 text-center mt-6">
            Already have an account?
            <a href="/dashboard/login" class="text-blue-600 hover:underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
