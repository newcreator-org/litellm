<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Connect LM SaaS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-active { color: #16a34a; }
        .status-provisioning { color: #ca8a04; }
        .status-suspended { color: #9ca3af; }
        .status-error { color: #dc2626; }
        .status-deleting { color: #ea580c; }
        .budget-warn { color: #ca8a04; }
        .budget-over { color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% if user %}
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center space-x-6">
                    <a href="/dashboard/" class="text-lg font-semibold text-gray-900">Connect LM SaaS</a>
                    <a href="/dashboard/" class="text-sm text-gray-600 hover:text-gray-900">Organisations</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">{{ user.display_name }} ({{ user.role }})</span>
                    <a href="/dashboard/logout" class="text-sm text-red-600 hover:text-red-800">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% if flash_message %}
        <div class="mb-4 p-3 rounded-md {% if flash_type == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %}">
            {{ flash_message }}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
